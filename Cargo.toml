[package]
name = "utterly"
version = "0.1.0"
edition = "2021"
description = "Minimal push-to-talk dictation pill using Gemini 3.5 Transcribe Live"
license = "MIT"

[[bin]]
name = "utterly"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
winit = "0.30"
softbuffer = "0.4"
raw-window-handle = "0.6"
tray-icon = "0.2"
arboard = { version = "3.4", default-features = false }
enigo = "0.2"

# Linux tray menus are GTK-based (libappindicator); init + pump GTK on that
# OS only. Never linked on macOS/Windows.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.15"

[target.'cfg(not(target_os = "windows"))'.dependencies]
global-hotkey = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.56", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }

# Performance-optimized release profile: no installer/RAM size budgets are
# enforced, but the build must stay lean and fast. Fat LTO and a single
# codegen unit keep the binary compact and fully inlined without trading
# away runtime speed.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
