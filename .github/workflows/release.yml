name: release

# Pushing a tag like v0.1.0 builds optimized binaries for Windows, Linux
# and macOS (ARM + Intel) and publishes them on a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: utterly
            asset: utterly-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: utterly.exe
            asset: utterly-windows-x86_64.exe
          - os: macos-14
            target: aarch64-apple-darwin
            bin: utterly
            asset: utterly-macos-aarch64
          - os: macos-14
            target: x86_64-apple-darwin
            bin: utterly
            asset: utterly-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libxkbcommon-dev libx11-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - run: cargo build --release --target ${{ matrix.target }}
        shell: bash
      - shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
          ls -lh dist/
      - name: UPX compress (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq upx
          upx --best --lzma "dist/${{ matrix.asset }}"
          ls -lh dist/
          sha256sum dist/*
      - name: size gate <5MB (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          test $(stat -c%s "dist/${{ matrix.asset }}") -lt 5242880 || (echo "size >5MB" && exit 1)
      # NOTE: NO UPX on Windows/macOS — UPX-packed binaries trigger
      # Defender/Gatekeeper heuristics. Ship raw binary + zip instead.
      - name: zip + sha256 (Windows/macOS only, no UPX)
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            7z a "dist/${{ matrix.asset }}.zip" "dist/${{ matrix.asset }}" assets/utterly.ico
          else
            zip -j "dist/${{ matrix.asset }}.zip" "dist/${{ matrix.asset }}"
          fi
          ls -lh dist/
          sha256sum dist/*
      - name: Windows portable package size (informational)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archive = Get-Item "dist/${{ matrix.asset }}.zip"
          $mib = [Math]::Round($archive.Length / 1MB, 2)
          Write-Host "Windows portable package: $($archive.Length) bytes ($mib MiB)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -lh dist/
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Utterly ${{ github.ref_name }} — push-to-talk dictation pill.

            Hold your shortcut, speak, release: Utterly streams audio to Gemini
            3.5 Transcribe Live and shows revisable text while you speak. New
            Windows configs use Ctrl+Win; macOS and Linux default to Alt+Space.
            Windows pastes only into the same editable target captured at the
            start of recording. If that target is unavailable or changes, the
            final transcript stays on the clipboard.

            Binaries: Windows (.exe), Linux, macOS Apple Silicon + Intel.
            Windows portable ZIP size is reported as a measurement; no fixed
            5 MiB cap applies. Linux release retains its UPX and size gates.
            Bring your own AI Studio key.

            Quick start: get a key at https://aistudio.google.com/apikey →
            copy it, then paste via the tray menu (or run `utterly --set-key`) → hold
            your shortcut and dictate. On Windows, run `utterly --settings` to
            open the native Settings window.

            macOS: unsigned build — right-click > Open on first launch, then
            grant Microphone + Accessibility. Windows: allow microphone access
            on first run. See README for details.
